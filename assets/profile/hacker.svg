<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 320 320" role="img" aria-label="Hooded faceless hacker silhouette behind a laptop with a skull logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.rain{font:10px monospace;fill:#00FF41;opacity:.22}
.main{animation:br 3s ease-in-out infinite,dist 4.6s steps(1) infinite}@keyframes br{50%{transform:translateY(3px)}}
.s1{opacity:0;animation:g1 4s steps(1) infinite}
@keyframes g1{0%,84%,100%{opacity:0}85%{opacity:1;transform:translateX(-14px)}88%{opacity:1;transform:translateX(12px)}91%{opacity:0}}
.s2{opacity:0;animation:g2 4s steps(1) infinite}
@keyframes g2{0%,60%,100%{opacity:0}61%{opacity:1;transform:translateX(16px)}64%{opacity:1;transform:translateX(-9px)}67%{opacity:0}}
.eye{opacity:0;animation:ey 4s steps(1) infinite}
@keyframes ey{0%,85%,100%{opacity:0}86%,90%{opacity:1}91%{opacity:0}92%,94%{opacity:1}95%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

@keyframes dist{0%,80%,100%{filter:none}81%{filter:url(#d1)}84%{filter:url(#d2)}87%{filter:none}90%{filter:url(#d1)}93%{filter:none}}
@keyframes pop{0%,70%,100%{opacity:0}71%{opacity:1}74%{opacity:1;transform:translate(6px,-3px)}77%{opacity:1;transform:translate(-5px,2px)}80%{opacity:0}}
.s3{opacity:0;animation:g1 3.3s steps(1) infinite -.8s}.s4{opacity:0;animation:g2 5.1s steps(1) infinite -2s}
.e1{opacity:0;animation:pop 5s steps(1) infinite}.e2{opacity:0;animation:pop 4.3s steps(1) infinite -1.7s}
.e3{opacity:0;animation:pop 6s steps(1) infinite -3.2s}.e4{opacity:0;animation:pop 3.7s steps(1) infinite -.9s}
.nz{opacity:0;animation:pop 2.2s steps(1) infinite -.4s}
.eb{font:bold 8px monospace}.et{font:9px monospace}
</style>
